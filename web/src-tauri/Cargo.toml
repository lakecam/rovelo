[package]
name = "rovelo-desktop"
version = "0.2.0"
edition = "2021"
description = "Rovelo desktop shell"

# Own workspace: this shell is not a member of the repository's crate workspace.
[workspace]

[lib]
name = "rovelo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
